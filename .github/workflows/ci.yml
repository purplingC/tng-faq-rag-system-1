name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.11", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify the package runs with no third-party runtime dependencies
        run: python -c "import tngd_faq_rag; print(tngd_faq_rag.ask_tngd_bot('What is CardMatch?')['decision'])"
      - name: Test
        run: pytest --cov=tngd_faq_rag --cov-report=term-missing
      - name: Golden-set evaluation
        run: python -m tngd_faq_rag eval

  quality:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Types
        run: mypy

  no-deps:
    name: runs on a bare interpreter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # No NumPy and nothing but the package, which is what proves the zero dependency claim
      - run: pip install --no-deps -e .
      - run: python -m tngd_faq_rag smoke
      - run: python -m tngd_faq_rag eval

  docker:
    name: docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tngd-faq-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report image size
        run: docker image ls tngd-faq-rag:ci --format "{{.Repository}}:{{.Tag}}  {{.Size}}"
      - name: Run it and check it actually serves
        run: |
          docker run -d --name api -p 8080:8080 tngd-faq-rag:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/v1/health/ready && break
            sleep 2
          done
          echo
          curl -fsS -X POST http://127.0.0.1:8080/v1/ask \
            -H 'Content-Type: application/json' \
            -d '{"question":"What is TNG eWallet SOS Balance?"}' | head -c 300
          echo
          docker logs api | tail -20
          docker rm -f api

