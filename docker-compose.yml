# Local run: `docker compose up --build`, then open http://localhost:8080/docs
#
# Not a production topology, which needs TLS upstream and a shared rate limiter

services:
  api:
    build: .
    image: tngd-faq-rag:local
    ports:
      - "8080:8080"
    environment:
      # Uncomment to require authentication
      # TNGD_API_KEYS: "change-me"
      TNGD_RATE_LIMIT: "60"
      # Log timestamps in Malaysian time, change for another region
      TZ: "Asia/Kuala_Lumpur"
      # Answerability grading if you have a key, see .env.example
      # LLM_API_BASE: "https://generativelanguage.googleapis.com/v1beta/openai"
      # LLM_MODEL: "gemini-3.5-flash-lite"
      # LLM_API_KEY: "${LLM_API_KEY}"
      TNGD_GENERATOR: "extractive"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/v1/health/ready', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
